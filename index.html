<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex API - Evaluación Web</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="bg-light">

    <header class="bg-danger text-white text-center py-4 border-bottom border-dark border-5 shadow">
        <h1>Pokédex Interactiva</h1>
        <nav class="mt-3">
            <ul class="nav justify-content-center">
                <li class="nav-item"><a href="#inicio" class="nav-link link-menu">Inicio</a></li>
                <li class="nav-item"><a href="#buscador" class="nav-link link-menu">Buscador API</a></li>
            </ul>
        </nav>
    </header>

    <main class="container my-5">
        
        <section id="inicio" class="text-center mb-5 caja-custom">
            <h2 class="mb-3">¡Bienvenido Entrenador!</h2>
            <p>Esta plataforma consume datos de la PokéAPI externa para mostrar y filtrar Pokémon dinámicamente.</p>
        </section>

        <section id="buscador" class="caja-custom">
            <h2 class="text-center mb-4">Base de Datos Pokémon</h2>
            
            <div class="mb-4">
                <input type="text" id="inputFiltro" class="form-control form-control-lg border-warning shadow-sm" placeholder="🔍 Escribe para filtrar un Pokémon en pantalla..." onkeyup="filtrarDOM()">
            </div>

            <div id="contenedorResultados" class="row g-4">
                <div class="col-12 text-center">
                    <p class="text-muted">Cargando datos desde la API externa...</p>
                </div>
            </div>
        </section>

    </main>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <p class="mb-0">Desarrollado para la evaluación de Desarrollo Web API.</p>
    </footer>

    <script src="assets/js/script.js"></script>
</body>
</html>
